<h1 class="titre-gestion">FORMULAIRE DE CONTACT</h1>

<div class="formulaire-equipement">
    <form>

        <div class="champ">
            <label for="nom">Nom Complet *</label>
            <input type="text" id="nom" name="nom_complet" required>
        </div>

        <div class="champ">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom">
        </div>

        <div class="champ">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="champ">
            <label for="tel">Téléphone *</label>
            <input type="tel" id="tel" name="telephone" required>
        </div>

        <div class="champ-message">
            <label for="message">Message (1000 caractères max) *</label>
            <textarea id="message" name="message" maxlength="1000" rows="8" required></textarea>
        </div>

        <div class="boutons">
            <button type="submit">ENVOYER</button>
        </div>

        <p class="champ-obligatoire">* Champ obligatoire</p>

    </form>
</div>

</body>
