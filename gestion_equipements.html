<h1 class="titre-gestion">GESTION DES ÉQUIPEMENTS</h1>

<div class="formulaire-equipement">
    <form>

        <div class="champ">
            <label for="nom">Nom équipement *</label>
            <input type="text" id="nom" name="nom">
        </div>

        <div class="champ">
            <label for="designation">Désignation équipement *</label>
            <input type="text" id="designation" name="designation">
        </div>

        <div class="champ">
            <label for="quantite">Quantité</label>
            <input type="text" id="quantite" name="quantite">
        </div>

        <div class="champ">
            <label for="cout">Coût / Jour *</label>
            <input type="text" id="cout" name="cout">
        </div>

        <div class="type-equipement">
            <p>Type de l'équipement</p>
            <label><input type="radio" name="type" value="numerique" checked> Numérique</label>
            <label><input type="radio" name="type" value="mobilier"> Mobilier</label>
            <label><input type="radio" name="type" value="decoration"> Décoration</label>
        </div>

        <div class="boutons">
            <button type="button">RECHERCHER</button>
            <button type="submit">AJOUTER</button>
            <button type="button">MODIFIER</button>
        </div>

        <p class="champ-obligatoire">* Champ obligatoire</p>

    </form>
</div>
